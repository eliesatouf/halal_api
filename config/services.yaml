# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\State\RegisterUserProcessor:
        arguments:
            $persistProcessor: '@api_platform.doctrine.orm.state.persist_processor'
            $loyverseSyncService: '@App\Service\LoyverseSyncService' # Add this
        tags: [ 'api_platform.state_processor' ]
        public: true
            
    App\Security\ActiveUserChecker: ~  #check if user account isActive()

    # App\State\OfferProvider:
    #     tags: ['api_platform.state_provider']

    # offer.active_filter:
    #     class: App\Filter\ActiveOfferFilter
    #     tags: ['api_platform.filter']

    submenu.MenuName_filter:
        class: App\Filter\MenuNameFilter
        tags: ['api_platform.filter']

    dish.dishType_filter:
        class: App\Filter\DishTypeFilter
        tags: ['api_platform.filter']

    event.active_filter:
        class: App\Filter\ActiveEventFilter
        tags: ['api_platform.filter']

    customer.customer_search_filter:
        class: App\Filter\CustomerSearchFilter
        tags: ['api_platform.filter']

    App\State\OrderProcessor:
        bind:
            $persistProcessor: '@api_platform.doctrine.orm.state.persist_processor'
        tags:
            - { name: api_platform.state_processor }

    App\Filter\CustomerOrderFilter:
        tags:
            - { name: api_platform.filter }

    App\State\CustomerStateProcessor:
        bind:
            $persistProcessor: '@api_platform.doctrine.orm.state.persist_processor'
        tags:
            - { name: api_platform.state_processor }

    App\State\BundleProcessor:
        bind:
            $persistProcessor: '@api_platform.doctrine.orm.state.persist_processor'
        tags:
            - { name: api_platform.state_processor }

    # App\State\OrderBogoProcessor:
    #     bind:
    #         $persistProcessor: '@api_platform.doctrine.orm.state.persist_processor'
    #     tags:
    #         - { name: 'api_platform.state_processor', priority: 1 }

    # App\State\OfferProcessor:
    #     arguments:
    #         $persistProcessor: '@api_platform.doctrine.orm.state.persist_processor'
    #     tags: [ 'api_platform.state_processor' ]

    App\State\PasswordResetRequestProcessor:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $mailer: '@mailer'
            $logger: '@logger'
        tags:
            - { name: 'api_platform.state_processor', priority: 10 }
            
    App\State\PasswordResetProcessor:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $passwordHasher: '@security.user_password_hasher'
        tags:
            - { name: 'api_platform.state_processor', priority: 10 }
            
    App\State\OfferProcessor:
        arguments:
            $persistProcessor: '@api_platform.doctrine.orm.state.persist_processor'
            $offerTypeRepository: '@App\Repository\OfferTypeRepository'
            $strategies: !tagged_iterator app.offer_strategy
            $entityManager: '@doctrine.orm.entity_manager'
            $orderEmailService: '@App\Service\OrderEmailService'
            $loyverseSyncService: '@App\Service\LoyverseSyncService'
        tags: ['api_platform.state_processor']      

    # Offer Strategies
    App\Service\OfferStrategy\BogoStrategy:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
        tags: ['app.offer_strategy']

    App\Service\OfferStrategy\BundleStrategy:
        tags: [ 'app.offer_strategy' ]
        
    App\Service\OfferStrategy\DiscountStrategy:
        tags: [ 'app.offer_strategy' ]

    App\Service\OfferStrategy\BuyXGetYStrategy:
        tags: [ 'app.offer_strategy' ]
        
    App\Service\OfferStrategy\FirstOrderDiscountStrategy:
        tags: ['app.offer_strategy']
    
    # Order Email Service
    App\Service\OrderEmailService:
        arguments:
            $mailer: '@mailer'
            $twig: '@twig'

    tagged_iterator.app.offer_strategy:
        class: 'iterable'
        factory: ['@service_container', 'get']
        arguments: ['tagged_iterator app.offer_strategy']

    App\Controller\OrderPreviewController:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $serializer: '@serializer'
            $logger: '@logger'
            $strategies: !tagged_iterator 'app.offer_strategy'
        tags: ['controller.service_arguments']

    App\EventSubscriber\OfferApiSubscriber:
        arguments:
            $offerTypeRepository: '@App\Repository\OfferTypeRepository'
        tags:
            - { name: kernel.event_subscriber }


    App\Service\DiningSalesReportGenerator:
        arguments:
            $orderRepository: '@App\Repository\OrderRepository'
            $entityManager: '@Doctrine\ORM\EntityManagerInterface'

    App\EventSubscriber\JWTPayloadEnhancer:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_created, method: onJWTCreated }

    App\Service\LoyverseSyncService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $logger: '@logger'
        public: true
        
    App\State\TableReservationProcessor:
        arguments:
            $persistProcessor: '@api_platform.doctrine.orm.state.persist_processor'
        tags:
            - name: api_platform.state_processor
              processor: 'table_reservation.processor'

    App\Entity\TableReservation:
        tags:
            - name: api_platform.state_processor
              processor: 'table_reservation.processor'

    App\State\CompleteAppointmentProcessor:
        bind:
            $persistProcessor: '@api_platform.doctrine.orm.state.persist_processor'
        tags:
            - { name: api_platform.state_processor }

    App\Repository\SettingsRepository:
        arguments:
            $registry: '@doctrine'
            $settingsCache: '@settings.cache'

    App\Controller\FirstOrderDiscountController:
        arguments:
            $settingsCache: '@settings.cache'

    App\State\HomepageDataProvider:
        arguments:
            $homepageCache: '@homepage.cache'

    App\State\HomepageCriticalProvider:
        arguments:
            $homepageCache: '@homepage.cache'
        tags:
            - { name: 'api_platform.state_provider' }
    
    App\State\HomepageDeferredProvider:
        arguments:
            $homepageCache: '@homepage.cache'
        tags:
            - { name: 'api_platform.state_provider' }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
